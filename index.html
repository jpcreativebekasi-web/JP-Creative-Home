<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JP Creative - Penerbit Profesional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>tailwind.config={theme:{extend:{fontFamily:{inter:['Inter','sans-serif']}}}}</script>
    <style>
        *{font-family:'Inter',sans-serif}html{scroll-behavior:smooth}
        ::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:#0a0a0a}
        ::-webkit-scrollbar-thumb{background:#333;border-radius:3px}::-webkit-scrollbar-thumb:hover{background:#555}
        @keyframes fadeInUp{0%{opacity:0;transform:translateY(20px)}100%{opacity:1;transform:translateY(0)}}
        @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
        @keyframes tabIn{0%{opacity:0;transform:translateY(4px)}100%{opacity:1;transform:translateY(0)}}
        .anim-up{animation:fadeInUp .8s ease-out forwards;opacity:0}
        .d1{animation-delay:.1s}.d2{animation-delay:.2s}.d3{animation-delay:.3s}.d4{animation-delay:.4s}
        .glass{background:rgba(23,23,23,.6);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
        .hero-ov{background:linear-gradient(to bottom,rgba(0,0,0,.75) 0%,rgba(0,0,0,.5) 50%,#0a0a0a 100%)}
        .pricing-hl{border:2px solid #a855f7;box-shadow:0 0 30px rgba(168,85,247,.2)}
        .admin-sb::-webkit-scrollbar{width:4px}.admin-sb::-webkit-scrollbar-track{background:transparent}
        .admin-sb::-webkit-scrollbar-thumb{background:#334155;border-radius:2px}
        .tcb:checked+.tlbl{background:#a855f7}.tcb:checked+.tlbl::after{transform:translateX(20px)}
        .tlbl{width:44px;height:24px;background:#cbd5e1;border-radius:12px;position:relative;cursor:pointer;transition:background .3s;display:inline-block}
        .tlbl::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;background:#fff;border-radius:50%;transition:transform .3s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
        .pwd-shake{animation:shake .4s ease-in-out}
        .tab-in{animation:tabIn .2s ease-out}
        .img-tab{transition:all .2s}
        .img-tab.active{background:#f3e8ff;color:#7c3aed;border-color:#c084fc}
    </style>
</head>
<body class="bg-[#0a0a0a] text-white">

<div id="app"></div>
<div id="toast-box" class="fixed top-6 right-6 z-[9999] flex flex-col gap-3"></div>

<!-- PASSWORD MODAL -->
<div id="pwd-modal" class="hidden fixed inset-0 z-[9998] flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-black/70 backdrop-blur-sm" onclick="closePwd()"></div>
    <div id="pwd-card" class="relative bg-[#1a1a1a] border border-white/10 rounded-2xl p-8 w-full max-w-sm shadow-2xl">
        <button onclick="closePwd()" class="absolute top-4 right-4 text-neutral-500 hover:text-white transition-colors"><span class="iconify" data-icon="lucide:x" data-width="20"></span></button>
        <div class="text-center mb-6">
            <div class="w-14 h-14 bg-purple-500/10 rounded-2xl flex items-center justify-center mx-auto mb-4"><span class="iconify text-purple-400" data-icon="lucide:lock" data-width="28"></span></div>
            <h3 class="text-xl font-semibold">Akses Admin</h3>
            <p class="text-sm text-neutral-500 mt-1">Masukkan password untuk melanjutkan</p>
        </div>
        <div>
            <input type="password" id="pwd-input" placeholder="Password" autocomplete="off"
                class="w-full px-4 py-3 bg-[#0a0a0a] border border-white/10 rounded-xl text-white text-sm focus:outline-none focus:ring-2 focus:ring-purple-500/50 focus:border-purple-500 transition-all"
                onkeydown="if(event.key==='Enter')checkPwd()">
            <p id="pwd-err" class="hidden text-red-400 text-xs mt-2 flex items-center gap-1"><span class="iconify" data-icon="lucide:alert-circle" data-width="14"></span>Password salah. Coba lagi.</p>
        </div>
        <button onclick="checkPwd()" class="w-full mt-4 px-6 py-3 bg-purple-500 hover:bg-purple-600 text-white text-sm font-medium rounded-xl transition-colors">Masuk</button>
    </div>
</div>

<script>
// ===================== DEFAULT DATA =====================
const DEFAULTS={
    logo:'https://drive.google.com/uc?export=view&id=1XsU73SXdWvlx5mVdpDrPWn3iB1rcqq7w',
    background:'https://drive.google.com/uc?export=view&id=1n12goouIU_gLQLyffHNg2xsMv-4ROb17',
    hero:{title:'Wujudkan Karya Tulismu Bersama JP Creative',subtitle:'Penerbit profesional yang membantu penulis pemula hingga berpengalaman menerbitkan buku berkualitas dengan harga terjangkau. Dari naskah hingga buku cetak siap distribusi.',ctaText:'Terbitkan Buku Sekarang',ctaLink:'#packages'},
    menus:[
        {text:'Ghostwriter',link:'#ghostwriter',icon:'lucide:pen-tool'},
        {text:'Pelatihan Menulis',link:'#pelatihan',icon:'lucide:graduation-cap'},
        {text:'Terbit Murah 50K',link:'#terbit-murah',icon:'lucide:book-open'},
        {text:'Paket Penerbitan',link:'#packages',icon:'lucide:package'}
    ],
    services:[
        {id:'ghostwriter',icon:'lucide:pen-tool',title:'Ghostwriter',description:'Jasa penulisan buku oleh penulis profesional. Anda cukup sampaikan ide, kami yang mewujudkannya menjadi buku berkualitas tinggi.',features:['Fiksi & Non-Fiksi','Penulis Berpengalaman','Revisi Hingga Puas','Konsultasi Gratis']},
        {id:'pelatihan',icon:'lucide:graduation-cap',title:'Pelatihan Menulis',description:'Kelas menulis intensif untuk meningkatkan kemampuan menulis Anda dari pemula hingga level lanjutan dengan pendekatan praktis.',features:['Kelas Online & Offline','Mentor Profesional','Sertifikat Peserta','Modul Lengkap']},
        {id:'terbit-murah',icon:'lucide:book-open',title:'Terbit Murah Mulai 50K',description:'Paket penerbitan paling terjangkau. Cocok untuk penulis pemula yang ingin bukunya terbit tanpa biaya besar.',features:['ISBN Resmi','Desain Cover Standar','Cetak Min. 20 Eksemplar','File Digital PDF']},
        {id:'paket-lengkap',icon:'lucide:package',title:'Paket Penerbitan Lengkap',description:'Layanan penerbitan menyeluruh dari editing, desain, percetakan hingga distribusi ke toko buku online.',features:['Editing Profesional','Layout & Typesetting','Distribusi Digital','Promosi Online']}
    ],
    packages:[
        {id:'starter',name:'Starter',price:'50K',priceNote:'Mulai dari',description:'Paket terjangkau untuk memulai',features:['ISBN Resmi','Desain Cover Standar','Cetak 20 Eksemplar','File Digital PDF'],highlight:false},
        {id:'standard',name:'Standard',price:'250K',priceNote:'Mulai dari',description:'Paket lengkap untuk penulis serius',features:['ISBN Resmi','Desain Cover Premium','Cetak 50 Eksemplar','Editing Dasar','Layout Profesional','File Digital PDF & EPUB'],highlight:true},
        {id:'premium',name:'Premium',price:'500K',priceNote:'Mulai dari',description:'Paket premium untuk kualitas maksimal',features:['ISBN Resmi','Desain Cover Custom','Cetak 100 Eksemplar','Editing Profesional','Layout Premium','Distribusi Digital','Promosi Online','File Digital Lengkap'],highlight:false},
        {id:'ghostwriter-pkg',name:'Ghostwriter',price:'1.5Jt',priceNote:'Mulai dari',description:'Jasa penulisan lengkap oleh tim kami',features:['Penulis Profesional','Riset Materi','Editing 3x','Desain Cover','Cetak 50 Eksemplar','ISBN Resmi','Konsultasi Ilimitas'],highlight:false}
    ],
    pages:[
        {id:'tentang',title:'Mengapa Memilih JP Creative?',content:'JP Creative adalah penerbit independen yang telah membantu ratusan penulis menerbitkan karya mereka. Kami percaya bahwa setiap orang punya cerita yang layak untuk dibukukan.\n\nDengan tim profesional dan proses yang transparan, kami memastikan setiap buku yang terbit memenuhi standar kualitas tinggi. Mulai dari konsultasi awal, proses editing, desain cover, hingga distribusi — semuanya kami tangani dengan penuh dedikasi.',image:'',show:true}
    ],
    footer:{desc:'Penerbit profesional yang membantu mewujudkan karya tulis terbaik Anda.',address:'Jl. Kreatif No. 123, Jakarta',phone:'0812-3456-7890',email:'info@jpcreative.id',ig:'https://instagram.com/jpcreative',fb:'https://facebook.com/jpcreative',tt:'https://tiktok.com/@jpcreative'}
};

// ===================== STATE =====================
let D,section='dashboard',editMode=false,editIdx=-1,sbOpen=false;
let imgTabLogo='upload',imgTabBg='upload',imgTabPage='upload';

// ===================== STORAGE =====================
function getScriptUrl(){try{return localStorage.getItem('jpc_script_url')||''}catch(e){return ''}}
function load(){try{const s=localStorage.getItem('jpc_data');if(s)return JSON.parse(s)}catch(e){}return JSON.parse(JSON.stringify(DEFAULTS))}
function saveLocal(){try{localStorage.setItem('jpc_data',JSON.stringify(D));return true}catch(e){return false}}
function isBase64(s){return s&&s.startsWith('data:')}
function stripForCloud(d){
    const c=JSON.parse(JSON.stringify(d));
    if(isBase64(c.logo))c.logo='[LOCAL_IMAGE]';
    if(isBase64(c.background))c.background='[LOCAL_IMAGE]';
    (c.pages||[]).forEach(p=>{if(isBase64(p.image))p.image='[LOCAL_IMAGE]'});
    return c;
}
function mergeWithLocal(cloud,local){
    if(!local)return cloud;
    if(cloud.logo==='[LOCAL_IMAGE]'&&local.logo)cloud.logo=local.logo;
    if(cloud.background==='[LOCAL_IMAGE]'&&local.background)cloud.background=local.background;
    (cloud.pages||[]).forEach((cp,i)=>{if(cp.image==='[LOCAL_IMAGE]'&&local.pages&&local.pages[i]&&local.pages[i].image)cp.image=local.pages[i].image});
    return cloud;
}
function save(){
    if(!saveLocal()){toast('Gagal menyimpan. Storage penuh atau gambar terlalu besar.','error');return}
    toast('Data berhasil disimpan!','success');
    const url=getScriptUrl();
    if(url){try{fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(stripForCloud(D))}).catch(()=>{})}catch(e){}}
}
async function syncFromCloud(){
    const url=getScriptUrl();if(!url){toast('URL Google Script belum diatur.','error');return}
    try{toast('Mengunduh data dari cloud...','info');const res=await fetch(url);const txt=await res.text();const cloud=JSON.parse(txt);
    if(cloud&&cloud.hero){const local=JSON.parse(localStorage.getItem('jpc_data')||'{}');D=mergeWithLocal(cloud,local);saveLocal();render();toast('Data berhasil disinkronkan dari cloud!','success')}else{toast('Data cloud kosong atau tidak valid.','error')}}catch(e){toast('Gagal mengunduh dari cloud. Periksa URL & koneksi.','error')}
}
async function pushCloud(){
    const url=getScriptUrl();if(!url){toast('URL belum diatur.','error');return}
    try{toast('Mengirim data ke cloud...','info');await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(stripForCloud(D))});toast('Data berhasil dikirim ke cloud!','success')}catch(e){toast('Gagal mengirim ke cloud.','error')}}
async function testConn(){
    const url=document.getElementById('script-url').value.trim();if(!url){toast('Masukkan URL terlebih dahulu.','error');return}
    try{toast('Menguji koneksi...','info');const res=await fetch(url);const txt=await res.text();JSON.parse(txt);toast('Koneksi berhasil! Data cloud ditemukan.','success')}catch(e){toast('Koneksi gagal. Periksa URL & pastikan script sudah di-deploy.','error')}}
function saveUrl(){const url=document.getElementById('script-url').value.trim();if(url){localStorage.setItem('jpc_script_url',url);toast('URL berhasil disimpan!','success')}else{localStorage.removeItem('jpc_script_url');toast('URL dihapus. Kembali ke penyimpanan lokal.','info')}render()}
function resetAll(){if(confirm('Yakin reset semua data ke default?')){localStorage.removeItem('jpc_data');D=load();editMode=false;editIdx=-1;save();render();toast('Data direset ke default.','success')}}
function exportData(){const blob=new Blob([JSON.stringify(D,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='jpcreative-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);toast('Data berhasil diekspor!','success')}
function importData(inp){if(!inp.files||!inp.files[0])return;const r=new FileReader();r.onload=function(e){try{const d=JSON.parse(e.target.result);if(d.hero&&d.menus){D=d;save();render();toast('Data berhasil diimpor!','success')}else{toast('Format file tidak valid.','error')}}catch(err){toast('Gagal membaca file.','error')}};r.readAsText(inp.files[0])}

// ===================== TOAST =====================
function toast(msg,type='success'){
    const c=document.getElementById('toast-box'),t=document.createElement('div');
    const bg=type==='success'?'bg-green-600':type==='error'?'bg-red-600':'bg-blue-600';
    const ic=type==='success'?'lucide:check-circle':type==='error'?'lucide:x-circle':'lucide:info';
    t.className=`${bg} text-white px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3 transform translate-x-[120%] transition-transform duration-300 max-w-sm`;
    t.innerHTML=`<span class="iconify flex-shrink-0" data-icon="${ic}" data-width="20"></span><span class="text-sm font-medium">${msg}</span>`;
    c.appendChild(t);requestAnimationFrame(()=>{t.classList.remove('translate-x-[120%]');t.classList.add('translate-x-0')});
    setTimeout(()=>{t.classList.add('translate-x-[120%]');setTimeout(()=>t.remove(),300)},3500);
}

// ===================== IMAGE RESIZE =====================
function resizeImg(file,mw,cb){const r=new FileReader();r.onload=function(e){const img=new Image();img.onload=function(){const cv=document.createElement('canvas');let w=img.width,h=img.height;if(w>mw){h=Math.round(h*mw/w);w=mw}cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);cb(cv.toDataURL('image/jpeg',0.8))};img.src=e.target.result};r.readAsDataURL(file)}

// ===================== AUTH =====================
function showPwd(){document.getElementById('pwd-modal').classList.remove('hidden');document.getElementById('pwd-input').value='';document.getElementById('pwd-err').classList.add('hidden');document.getElementById('pwd-card').classList.remove('pwd-shake');setTimeout(()=>document.getElementById('pwd-input').focus(),150)}
function closePwd(){document.getElementById('pwd-modal').classList.add('hidden')}
function checkPwd(){if(document.getElementById('pwd-input').value==='jp@dm1n'){closePwd();sessionStorage.setItem('jpc_auth','1');go('#admin')}else{document.getElementById('pwd-err').classList.remove('hidden');const card=document.getElementById('pwd-card');card.classList.remove('pwd-shake');void card.offsetWidth;card.classList.add('pwd-shake');document.getElementById('pwd-input').value='';document.getElementById('pwd-input').focus()}}
function tryAdmin(){if(sessionStorage.getItem('jpc_auth')==='1')go('#admin');else showPwd()}

// ===================== ROUTING =====================
function go(h){window.location.hash=h}
function view(){return window.location.hash==='#admin'?'admin':'landing'}

// ===================== RENDER =====================
function render(){const a=document.getElementById('app');view()==='admin'?renderAdmin(a):renderLanding(a);if(window.Iconify)setTimeout(()=>Iconify.scan(),50)}

// ===================== LANDING PAGE =====================
function renderLanding(c){const d=D;c.innerHTML=`
<nav class="fixed top-0 left-0 right-0 z-50 glass border-b border-white/10">
    <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
        <a href="#" class="flex items-center gap-3"><img src="${d.logo}" alt="JP Creative" class="h-10 w-auto object-contain" onerror="this.style.display='none'"></a>
        <div class="hidden md:flex items-center gap-8">${d.menus.map(m=>`<a href="${m.link}" class="text-sm font-medium text-neutral-400 hover:text-white transition-colors">${m.text}</a>`).join('')}</div>
        <div class="flex items-center gap-4">
            <a href="${d.hero.ctaLink}" class="hidden md:inline-flex items-center gap-2 bg-white text-neutral-950 text-sm font-medium px-5 py-2 rounded-full hover:bg-neutral-200 hover:scale-105 transition-all">${d.hero.ctaText}<span class="iconify" data-icon="lucide:arrow-right" data-width="16"></span></a>
            <button onclick="document.getElementById('mob-m').classList.toggle('hidden')" class="md:hidden"><span class="iconify" data-icon="lucide:menu" data-width="24"></span></button>
        </div>
    </div>
    <div id="mob-m" class="hidden md:hidden border-t border-white/10 bg-neutral-900/95 backdrop-blur-xl">
        <div class="px-6 py-4 flex flex-col gap-3">${d.menus.map(m=>`<a href="${m.link}" onclick="this.closest('#mob-m').classList.add('hidden')" class="text-sm font-medium text-neutral-400 hover:text-white py-2">${m.text}</a>`).join('')}
        <a href="${d.hero.ctaLink}" onclick="this.closest('#mob-m').classList.add('hidden')" class="inline-flex items-center justify-center bg-white text-neutral-950 text-sm font-medium px-5 py-2.5 rounded-full mt-2">${d.hero.ctaText}</a></div>
    </div>
</nav>
<section class="relative min-h-screen flex items-center justify-center overflow-hidden">
    <img src="${d.background}" alt="BG" class="absolute inset-0 w-full h-full object-cover">
    <div class="hero-ov absolute inset-0"></div>
    <div class="relative z-10 max-w-4xl mx-auto px-6 text-center pt-20">
        <div class="inline-flex items-center gap-2 bg-white/10 border border-white/10 rounded-full px-4 py-1.5 mb-8 anim-up"><span class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></span><span class="text-xs font-medium text-neutral-300">Menerima Naskah Baru</span></div>
        <h1 class="text-4xl md:text-6xl lg:text-7xl font-semibold tracking-tight leading-[1.1] mb-6 anim-up d1">${d.hero.title}</h1>
        <p class="text-base md:text-lg text-neutral-400 font-light leading-relaxed max-w-2xl mx-auto mb-10 anim-up d2">${d.hero.subtitle}</p>
        <div class="flex flex-col sm:flex-row items-center justify-center gap-4 anim-up d3">
            <a href="${d.hero.ctaLink}" class="inline-flex items-center gap-2 bg-white text-neutral-950 text-sm font-medium px-8 py-3.5 rounded-full hover:bg-neutral-200 hover:scale-105 transition-all">${d.hero.ctaText}<span class="iconify" data-icon="lucide:arrow-right" data-width="16"></span></a>
            <a href="${d.menus[0]?.link||'#'}" class="inline-flex items-center gap-2 border border-white/20 text-white text-sm font-medium px-8 py-3.5 rounded-full hover:bg-white/10 transition-all">Pelajari Lebih Lanjut</a>
        </div>
        <div class="absolute bottom-10 left-1/2 -translate-x-1/2 animate-bounce"><span class="iconify text-neutral-500" data-icon="lucide:chevron-down" data-width="24"></span></div>
    </div>
</section>
 ${d.pages.filter(p=>p.show).map(p=>`
<section id="page-${p.id}" class="py-24 px-6">
    <div class="max-w-7xl mx-auto ${p.image?'grid md:grid-cols-2 gap-16 items-center':''}">
        <div class="${p.image?'':'max-w-3xl mx-auto text-center'}">
            <h2 class="text-3xl md:text-4xl font-semibold tracking-tight mb-6">${p.title}</h2>
            <div class="text-neutral-400 font-light leading-relaxed text-lg whitespace-pre-line">${p.content}</div>
        </div>
        ${p.image?`<div class="relative"><img src="${p.image}" alt="${p.title}" class="rounded-2xl w-full object-cover aspect-[4/3]"><div class="absolute -inset-1 bg-gradient-to-r from-purple-500/20 to-blue-500/20 rounded-2xl blur-xl -z-10"></div></div>`:''}
    </div>
</section>`).join('')}
<section id="services" class="py-24 px-6 bg-[#0d0d0d]">
    <div class="max-w-7xl mx-auto">
        <div class="text-center mb-16"><span class="text-xs font-medium tracking-widest uppercase text-purple-400 mb-4 block">Layanan Kami</span><h2 class="text-3xl md:text-4xl font-semibold tracking-tight">Solusi Penerbitan Lengkap</h2></div>
        <div class="grid md:grid-cols-2 lg:grid-cols-4 gap-6">${d.services.map(s=>`
        <div id="${s.id}" class="group bg-neutral-900/50 border border-white/10 rounded-2xl p-8 hover:border-purple-500/50 transition-all duration-500 hover:-translate-y-2">
            <div class="w-12 h-12 bg-purple-500/10 rounded-xl flex items-center justify-center mb-6 group-hover:scale-110 transition-transform"><span class="iconify text-purple-400" data-icon="${s.icon}" data-width="24"></span></div>
            <h3 class="text-xl font-medium mb-3">${s.title}</h3>
            <p class="text-neutral-400 text-sm font-light leading-relaxed mb-5">${s.description}</p>
            <ul class="space-y-2">${s.features.map(f=>`<li class="flex items-center gap-2 text-sm text-neutral-500"><span class="iconify text-purple-400" data-icon="lucide:check" data-width="14"></span>${f}</li>`).join('')}</ul>
        </div>`).join('')}</div>
    </div>
</section>
<section id="packages" class="py-24 px-6">
    <div class="max-w-7xl mx-auto">
        <div class="text-center mb-16"><span class="text-xs font-medium tracking-widest uppercase text-purple-400 mb-4 block">Paket Harga</span><h2 class="text-3xl md:text-4xl font-semibold tracking-tight">Pilih Paket Terbaikmu</h2></div>
        <div class="grid md:grid-cols-2 lg:grid-cols-4 gap-6">${d.packages.map(p=>`
        <div class="relative ${p.highlight?'pricing-hl':'border border-white/10'} bg-neutral-900/50 rounded-2xl p-8 flex flex-col hover:-translate-y-2 transition-all duration-500">
            ${p.highlight?'<div class="absolute -top-3 left-1/2 -translate-x-1/2 bg-purple-500 text-white text-xs font-medium px-4 py-1 rounded-full">Populer</div>':''}
            <div class="mb-6"><p class="text-xs text-neutral-500 uppercase tracking-wider mb-1">${p.priceNote}</p><p class="text-4xl font-semibold">Rp ${p.price}</p></div>
            <h3 class="text-xl font-medium mb-2">${p.name}</h3>
            <p class="text-sm text-neutral-400 mb-6">${p.description}</p>
            <ul class="space-y-3 mb-8 flex-1">${p.features.map(f=>`<li class="flex items-start gap-2 text-sm text-neutral-400"><span class="iconify text-purple-400 mt-0.5 flex-shrink-0" data-icon="lucide:check" data-width="14"></span>${f}</li>`).join('')}</ul>
            <a href="https://wa.me/6281234567890?text=Halo, saya tertarik paket ${p.name}" target="_blank" class="${p.highlight?'bg-white text-neutral-950 hover:bg-neutral-200':'bg-white/10 text-white hover:bg-white/20'} text-sm font-medium px-6 py-3 rounded-full text-center transition-all hover:scale-105">Pilih Paket</a>
        </div>`).join('')}</div>
    </div>
</section>
<section class="py-24 px-6">
    <div class="max-w-4xl mx-auto text-center relative">

function inp(lb,id,val,tp='text',ph='',rows=0){const v=(val||'').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');if(rows>0)return`<div><label class="block text-sm font-medium text-gray-700 mb-1.5">${lb}</label><textarea id="${id}" rows="${rows}" placeholder="${ph}" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm text-gray-800 focus:outline-none focus:ring-2 focus:ring-purple-500/30 focus:border-purple-500 transition-all resize-none">${v}</textarea></div>`;return`<div><label class="block text-sm font-medium text-gray-700 mb-1.5">${lb}</label><input type="${tp}" id="${id}" value="${v}" placeholder="${ph}" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm text-gray-800 focus:outline-none focus:ring-2 focus:ring-purple-500/30 focus:border-purple-500 transition-all"></div>`}
function chk(lb,id,on){return`<div class="flex items-center gap-3"><input type="checkbox" id="${id}" ${on?'checked':''} class="hidden tcb"><label for="${id}" class="tlbl"></label><span class="text-sm text-gray-700">${lb}</span></div>`}
function btns(fn){return`<div class="flex gap-3 mt-6 pt-6 border-t border-gray-100"><button onclick="${fn}" class="px-6 py-2.5 bg-purple-500 hover:bg-purple-600 text-white text-sm font-medium rounded-xl transition-colors flex items-center gap-2"><span class="iconify" data-icon="lucide:save" data-width="16"></span>Simpan</button><button onclick="cancel()" class="px-6 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-medium rounded-xl transition-colors">Batal</button></div>`}

// ---- IMAGE SOURCE COMPONENT ----
function imgSrcComp(prefix, currentSrc, tabVar) {
    const tab = window[tabVar] || 'upload';
    const isLocal = isBase64(currentSrc);
    const srcLabel = isLocal ? 'Gambar Lokal (upload)' : (currentSrc ? currentSrc.substring(0, 60) + (currentSrc.length > 60 ? '...' : '') : 'Belum ada gambar');
    return `
    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Sumber Gambar</label>
        <div class="flex gap-2 mb-3">
            <button onclick="window['${tabVar}']='upload';render()" class="img-tab flex items-center gap-2 px-4 py-2 text-sm font-medium rounded-xl border ${tab==='upload'?'active border-purple-300':'border-gray-200 text-gray-500 hover:bg-gray-50'} transition-all"><span class="iconify" data-icon="lucide:upload" data-width="15"></span>Upload File</button>
            <button onclick="window['${tabVar}']='link';render()" class="img-tab flex items-center gap-2 px-4 py-2 text-sm font-medium rounded-xl border ${tab==='link'?'active border-purple-300':'border-gray-200 text-gray-500 hover:bg-gray-50'} transition-all"><span class="iconify" data-icon="lucide:link" data-width="15"></span>Link URL</button>
        </div>
        <div class="tab-in">
            ${tab==='upload'?`
                <div class="flex items-start gap-4">
                    <div class="w-24 h-24 rounded-xl ${currentSrc?'border border-gray-200':'bg-gray-100 border-2 border-dashed border-gray-300'} flex items-center justify-center overflow-hidden flex-shrink-0">
                        ${currentSrc?`<img src="${currentSrc}" class="w-full h-full object-cover">`:`<span class="iconify text-gray-400" data-icon="lucide:image-plus" data-width="28"></span>`}
                    </div>
                    <div>
                        <input type="file" id="${prefix}-file" accept="image/*" class="hidden" onchange="document.getElementById('${prefix}-fn').textContent=this.files[0]?this.files[0].name:'Pilih file...'">
                        <button type="button" onclick="document.getElementById('${prefix}-file').click()" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-medium rounded-xl transition-colors">Pilih File</button>
                        <p id="${prefix}-fn" class="text-xs text-gray-400 mt-1.5">Maks 5MB, otomatis dikompres</p>
                    </div>
                </div>
            `:`
                <div class="space-y-3">
                    <div class="flex items-start gap-4">
                        <div id="${prefix}-prev" class="w-24 h-24 rounded-xl ${currentSrc&&!isLocal?'border border-gray-200':'bg-gray-100 border-2 border-dashed border-gray-300'} flex items-center justify-center overflow-hidden flex-shrink-0">
                            ${currentSrc&&!isLocal?`<img src="${currentSrc}" class="w-full h-full object-cover">`:`<span class="iconify text-gray-400" data-icon="lucide:image" data-width="28"></span>`}
                        </div>
                        <div class="flex-1">
                            <input type="url" id="${prefix}-link" value="${isLocal?'':currentSrc}" placeholder="https://example.com/gambar.jpg" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm text-gray-800 focus:outline-none focus:ring-2 focus:ring-purple-500/30 focus:border-purple-500 transition-all" oninput="prevImg('${prefix}',this.value)">
                            <p class="text-xs text-gray-400 mt-1.5">Paste link gambar dari Google Drive, Imgur, Unsplash, dll</p>
                        </div>
                    </div>
                    <div class="p-3 bg-blue-50 rounded-xl">
                        <p class="text-xs font-medium text-blue-700 mb-1.5">Tips Link Google Drive:</p>
                        <p class="text-xs text-blue-600">Gunakan format: <code class="bg-blue-100 px-1.5 py-0.5 rounded text-[11px]">https://drive.google.com/uc?export=view&id=FILE_ID</code></p>
                    </div>
                </div>
            `}
        </div>
        ${currentSrc?`<div class="mt-2 flex items-center gap-2"><span class="w-2 h-2 rounded-full ${isLocal?'bg-orange-400':'bg-green-400'}"></span><span class="text-xs ${isLocal?'text-orange-600':'text-green-600'}">${isLocal?'Tersimpan lokal (tidak ke cloud)':'Tersimpan sebagai URL (ikut ke cloud)'}</span></div>`:''}
    </div>`;
}

function prevImg(prefix, url) {
    const prev = document.getElementById(prefix + '-prev');
    if (!prev) return;
    if (url.trim()) {
        prev.innerHTML = `<img src="${url.trim()}" class="w-full h-full object-cover" onerror="this.parentElement.innerHTML='<span class=\\'iconify text-red-400\\' data-icon=\\'lucide:image-off\\' data-width=\\'28\\'></span><p class=\\'text-[9px] text-red-400 absolute\\'>Error</p>'">`;
        prev.className = 'w-24 h-24 rounded-xl border border-gray-200 flex items-center justify-center overflow-hidden flex-shrink-0 relative';
    } else {
        prev.innerHTML = `<span class="iconify text-gray-400" data-icon="lucide:image" data-width="28"></span>`;
        prev.className = 'w-24 h-24 rounded-xl bg-gray-100 border-2 border-dashed border-gray-300 flex items-center justify-center overflow-hidden flex-shrink-0';
    }
    if (window.Iconify) setTimeout(() => Iconify.scan(), 50);
}

// ===================== ADMIN SECTIONS =====================
function adminContent(){
    switch(section){
        case 'dashboard':return aDash();
        case 'hero':return aHero();
        case 'menus':return aMenus();
        case 'services':return aServices();
        case 'packages':return aPackages();
        case 'pages':return aPages();
        case 'media':return aMedia();
        case 'footer':return aFooter();
        case 'settings':return aSettings();
        default:return aDash();
    }
}

        ${cd(`<h3 class="text-base font-semibold text-gray-800 mb-4">Aksi Cepat</h3><div class="grid grid-cols-2 lg:grid-cols-4 gap-3">${[{l:'Edit Hero',s:'hero'},{l:'Edit Menu',s:'menus'},{l:'Ganti Logo',s:'media'},{l:'Penyimpanan',s:'settings'}].map(a=>`<button onclick="sec('${a.s}')" class="p-4 bg-gray-50 hover:bg-purple-50 rounded-xl text-sm font-medium text-gray-700 hover:text-purple-600 transition-all text-left">${a.l}</button>`).join('')}</div>`)}
        ${cd(`<h3 class="text-base font-semibold text-gray-800 mb-4">Preview Cepat</h3><div class="relative rounded-xl overflow-hidden border border-gray-200 bg-gray-100 aspect-video flex items-center justify-center"><img src="${D.background}" class="w-full h-full object-cover opacity-40"><div class="absolute flex flex-col items-center gap-3"><span class="iconify text-gray-600" data-icon="lucide:eye" data-width="32"></span><button onclick="go('')" class="px-4 py-2 bg-white rounded-lg text-sm font-medium text-gray-700 shadow hover:bg-gray-50">Buka Full Preview</button></div></div>`)}
    </div>`;
}

function aHero(){const h=D.hero;return cd(`<h3 class="text-base font-semibold text-gray-800 mb-6">Edit Hero & Banner</h3><div class="space-y-4 max-w-2xl">${inp('Judul','h-t',h.title,'text','Masukkan judul hero')}${inp('Subjudul','h-s',h.subtitle,'text','Masukkan subjudul','',4)}<div class="grid grid-cols-2 gap-4">${inp('Teks Tombol','h-c',h.ctaText,'text','Teks tombol')}${inp('Link Tombol','h-cl',h.ctaLink,'text','#section-id')}</div></div>${btns("svHero()")}`)}

function aMenus(){

function svMenu(){const t=document.getElementById('m-t').value.trim();if(!t){toast('Teks menu wajib diisi','error');return}const o={text:t,link:document.getElementById('m-l').value.trim()||'#',icon:document.getElementById('m-i').value.trim()||'lucide:link'};if(editIdx>=0)D.menus[editIdx]=o;else D.menus.push(o);editMode=false;editIdx=-1;save();render()}

    return cd(`<div class="flex justify-between items-center mb-6"><h3 class="text-base font-semibold text-gray-800">Daftar Layanan (${D.services.length})</h3><button onclick="editMode=true;editIdx=-1;render()" class="px-4 py-2 bg-purple-500 hover:bg-purple-600 text-white text-sm font-medium rounded-xl transition-colors flex items-center gap-2"><span class="iconify" data-icon="lucide:plus" data-width="16"></span>Tambah</button></div><div class="grid md:grid-cols-2 gap-3">${D.services.length?D.services.map((s,i)=>`<div class="p-4 bg-gray-50 rounded-xl hover:bg-gray-100 transition-colors"><div class="flex items-start justify-between mb-2"><div class="flex items-center gap-2"><span class="iconify text-purple-500" data-icon="${s.icon}" data-width="18"></span><p class="text-sm font-medium text-gray-800">${s.title}</p></div><div class="flex gap-1"><button onclick="editMode=true;editIdx=${i};render()" class="p-1.5 hover:bg-gray-200 rounded-lg"><span class="iconify text-gray-500" data-icon="lucide:pencil" data-width="14"></span></button><button onclick="delSvc(${i})" class="p-1.5 hover:bg-red-50 rounded-lg"><span class="iconify text-red-400" data-icon="lucide:trash-2" data-width="14"></span></button></div></div><p class="text-xs text-gray-400 line-clamp-2">${s.description}</p></div>`).join(''):'<p class="text-sm text-gray-400 text-center py-8 col-span-2">Belum ada layanan.</p>'}</div>`)}
function svSvc(){const t=document.getElementById('s-t').value.trim();if(!t){toast('Judul wajib diisi','error');return}const o={id:document.getElementById('s-id').value.trim()||'svc-'+Date.now(),icon:document.getElementById('s-i').value.trim()||'lucide:briefcase',title:t,description:document.getElementById('s-d').value.trim(),features:document.getElementById('s-f').value.split('\n').map(f=>f.trim()).filter(Boolean)};if(editIdx>=0)D.services[editIdx]=o;else D.services.push(o);editMode=false;editIdx=-1;save();render()}
function delSvc(i){if(confirm('Hapus layanan ini?')){D.services.splice(i,1);save();render()}}

function aPackages(){
    if(editMode){const p=editIdx>=0?D.packages[editIdx]:{id:'',name:'',price:'',priceNote:'Mulai dari',description:'',features:[],highlight:false};return cd(`<h3 class="text-base font-semibold text-gray-800 mb-6">${editIdx>=0?'Edit':'Tambah'} Paket</h3><div class="space-y-4 max-w-2xl"><div class="grid grid-cols-2 gap-4">${inp('Nama Paket','pk-n',p.name,'text','Standard')}${inp('Harga','pk-p',p.price,'text','250K')}</div>${inp('Keterangan Harga','pk-pn',p.priceNote,'text','Mulai dari')}${chk('Tandai sebagai paket populer','pk-hl',p.highlight)}${inp('Deskripsi','pk-d',p.description,'text','Deskripsi singkat')}${inp('Fitur (satu per baris)','pk-f',p.features.join('\n'),'text','Fitur 1\nFitur 2','',5)}</div>${btns("svPkg()")}`)}
    return cd(`<div class="flex justify-between items-center mb-6"><h3 class="text-base font-semibold text-gray-800">Daftar Paket (${D.packages.length})</h3><button onclick="editMode=true;editIdx=-1;render()" class="px-4 py-2 bg-purple-500 hover:bg-purple-600 text-white text-sm font-medium rounded-xl transition-colors flex items-center gap-2"><span class="iconify" data-icon="lucide:plus" data-width="16"></span>Tambah</button></div><div class="grid md:grid-cols-2 gap-3">${D.packages.length?D.packages.map((p,i)=>`<div class="p-4 ${p.highlight?'border-2 border-purple-300 bg-purple-50/50':'bg-gray-50'} rounded-xl hover:bg-gray-100 transition-colors"><div class="flex items-start justify-between mb-2"><div><p class="text-sm font-medium text-gray-800">${p.name} ${p.highlight?'<span class="text-[10px] bg-purple-500 text-white px-2 py-0.5 rounded-full ml-1">Populer</span>':''}</p><p class="text-lg font-semibold text-purple-600">Rp ${p.price}</p></div><div class="flex gap-1"><button onclick="editMode=true;editIdx=${i};render()" class="p-1.5 hover:bg-gray-200 rounded-lg"><span class="iconify text-gray-500" data-icon="lucide:pencil" data-width="14"></span></button><button onclick="delPkg(${i})" class="p-1.5 hover:bg-red-50 rounded-lg"><span class="iconify text-red-400" data-icon="lucide:trash-2" data-width="14"></span></button></div></div><p class="text-xs text-gray-400">${p.features.length} fitur</p></div>`).join(''):'<p class="text-sm text-gray-400 text-center py-8 col-span-2">Belum ada paket.</p>'}</div>`)}
function svPkg(){const n=document.getElementById('pk-n').value.trim();if(!n){toast('Nama paket wajib diisi','error');return}const o={id:n.toLowerCase().replace(/\s+/g,'-')||'pkg-'+Date.now(),name:n,price:document.getElementById('pk-p').value.trim(),priceNote:document.getElementById('pk-pn').value.trim()||'Mulai dari',description:document.getElementById('pk-d').value.trim(),features:document.getElementById('pk-f').value.split('\n').map(f=>f.trim()).filter(Boolean),highlight:document.getElementById('pk-hl').checked};if(editIdx>=0)D.packages[editIdx]=o;else D.packages.push(o);editMode=false;editIdx=-1;save();render()}
function delPkg(i){if(confirm('Hapus paket ini?')){D.packages.splice(i,1);save();render()}}

function aPages(){
    if(editMode){const p=editIdx>=0?D.pages[editIdx]:{id:'',title:'',content:'',image:'',show:true};return cd(`<h3 class="text-base font-semibold text-gray-800 mb-6">${editIdx>=0?'Edit':'Tambah'} Halaman / Narasi</h3><div class="space-y-4 max-w-2xl">${inp('ID (anchor link)','pg-id',p.id,'text','tentang')}${inp('Judul','pg-t',p.title,'text','Judul halaman')}${inp('Konten / Narasi','pg-c',p.content,'text','Tulis narasi di sini... (mendukung enter untuk baris baru)',6)}${imgSrcComp('pg-img',p.image,'imgTabPage')}${chk('Tampilkan di Landing Page','pg-s',p.show)}</div>${btns("svPage()")}`)}
    return cd(`<div class="flex justify-between items-center mb-6"><h3 class="text-base font-semibold text-gray-800">Daftar Halaman (${D.pages.length})</h3><button onclick="editMode=true;editIdx=-1;render()" class="px-4 py-2 bg-purple-500 hover:bg-purple-600 text-white text-sm font-medium rounded-xl transition-colors flex items-center gap-2"><span class="iconify" data-icon="lucide:plus" data-width="16"></span>Tambah</button></div><div class="space-y-2">${D.pages.length?D.pages.map((p,i)=>`<div class="flex items-center justify-between p-4 bg-gray-50 rounded-xl hover:bg-gray-100 transition-colors"><div class="flex items-center gap-3"><span class="iconify ${p.show?'text-green-500':'text-gray-400'}" data-icon="${p.show?'lucide:eye':'lucide:eye-off'}" data-width="18"></span><div><p class="text-sm font-medium text-gray-800">${p.title||'(Tanpa judul)'}</p><p class="text-xs text-gray-400">#${p.id} · ${p.show?'Aktif':'Tersembunyi'}${p.image?' · '+(isBase64(p.image)?'<span class="text-orange-500">Img Lokal</span>':'<span class="text-green-500">Img URL</span>'):''}</p></div></div><div class="flex gap-1"><button onclick="editMode=true;editIdx=${i};render()" class="p-2 hover:bg-gray-200 rounded-lg"><span class="iconify text-gray-500" data-icon="lucide:pencil" data-width="15"></span></button><button onclick="delPage(${i})" class="p-2 hover:bg-red-50 rounded-lg"><span class="iconify text-red-400" data-icon="lucide:trash-2" data-width="15"></span></button></div></div>`).join(''):'<p class="text-sm text-gray-400 text-center py-8">Belum ada halaman tambahan.</p>'}</div>`)}
function svPage(){
    const t=document.getElementById('pg-t').value.trim();if(!t){toast('Judul wajib diisi','error');return}
    const done=(img)=>{const o={id:document.getElementById('pg-id').value.trim()||'page-'+Date.now(),title:t,content:document.getElementById('pg-c').value.trim(),image:img,show:document.getElementById('pg-s').checked};if(editIdx>=0)D.pages[editIdx]=o;else D.pages.push(o);editMode=false;editIdx=-1;imgTabPage='upload';save();render()};
    if(imgTabPage==='upload'){const fi=document.getElementById('pg-img-file');if(fi&&fi.files&&fi.files[0]){if(fi.files[0].size>5*1024*1024){toast('File terlalu besar (maks 5MB)','error');return}resizeImg(fi.files[0],1200,done)}else{done(editIdx>=0?D.pages[editIdx].image:'')}}
    else{const url=document.getElementById('pg-img-link').value.trim();done(url||'')}
}
function delPage(i){if(confirm('Hapus halaman ini?')){D.pages.splice(i,1);save();render()}}

function aMedia(){
    return`<div class="space-y-6">
        ${cd(`
            <h3 class="text-base font-semibold text-gray-800 mb-6">Logo</h3>
            ${imgSrcComp('logo-img',D.logo,'imgTabLogo')}
            <div class="mt-4"><button onclick="svLogo()" class="px-6 py-2.5 bg-purple-500 hover:bg-purple-600 text-white text-sm font-medium rounded-xl transition-colors flex items-center gap-2"><span class="iconify" data-icon="lucide:save" data-width="16"></span>Simpan Logo</button></div>
        `)}
        ${cd(`
            <h3 class="text-base font-semibold text-gray-800 mb-6">Background Hero</h3>
            ${imgSrcComp('bg-img',D.background,'imgTabBg')}
            <div class="mt-4"><button onclick="svBg()" class="px-6 py-2.5 bg-purple-500 hover:bg-purple-600 text-white text-sm font-medium rounded-xl transition-colors flex items-center gap-2"><span class="iconify" data-icon="lucide:save" data-width="16"></span>Simpan Background</button></div>
        `)}
        ${cd(`
            <div class="flex items-start gap-3"><span class="iconify text-blue-500 mt-0.5 flex-shrink-0" data-icon="lucide:info" data-width="18"></span><div>
                <p class="text-sm font-medium text-gray-800">Perbedaan Upload vs Link URL</p>
                <div class="mt-2 grid sm:grid-cols-2 gap-3">
                    <div class="p-3 bg-gray-50 rounded-xl"><p class="text-xs font-semibold text-gray-700 mb-1">Upload File</p><ul class="text-xs text-gray-500 space-y-0.5"><li>• Tersimpan di browser (lokal)</li><li class="text-orange-500">• Tidak ikut ke spreadsheet</li><li>• Otomatis dikompres</li><li>• Maks 5MB</li></ul></div>
                    <div class="p-3 bg-green-50 rounded-xl"><p class="text-xs font-semibold text-green-700 mb-1">Link URL</p><ul class="text-xs text-green-600 space-y-0.5"><li>• Gambar dari hosting eksternal</li><li class="font-semibold">• Ikut tersimpan ke spreadsheet</li><li>• Tidak ada batas ukuran</li><li>• Butuh koneksi internet</li></ul></div>
                </div>
            </div></div>
        `)}
    </div>`;
}

function svLogo(){
    const done=(img)=>{D.logo=img;imgTabLogo='upload';save();render()};
    if(imgTabLogo==='upload'){const fi=document.getElementById('logo-img-file');if(fi&&fi.files&&fi.files[0]){if(fi.files[0].size>5*1024*1024){toast('File terlalu besar (maks 5MB)','error');return}resizeImg(fi.files[0],400,done)}else{toast('Pilih file terlebih dahulu','error')}}
    else{const url=document.getElementById('logo-img-link').value.trim();if(!url){toast('Masukkan URL gambar','error');return}done(url)}
}
function svBg(){
    const done=(img)=>{D.background=img;imgTabBg='upload';save();render()};
    if(imgTabBg==='upload'){const fi=document.getElementById('bg-img-file');if(fi&&fi.files&&fi.files[0]){if(fi.files[0].size>5*1024*1024){toast('File terlalu besar (maks 5MB)','error');return}resizeImg(fi.files[0],1920,done)}else{toast('Pilih file terlebih dahulu','error')}}
    else{const url=document.getElementById('bg-img-link').value.trim();if(!url){toast('Masukkan URL gambar','error');return}done(url)}
}

function aFooter(){const f=D.footer;return cd(`<h3 class="text-base font-semibold text-gray-800 mb-6">Edit Footer</h3><div class="space-y-4 max-w-2xl">${inp('Deskripsi','f-d',f.desc,'text','Deskripsi singkat','',2)}${inp('Alamat','f-a',f.address,'text','Alamat lengkap')}${inp('Telepon','f-p',f.phone,'text','08xx-xxxx-xxxx')}${inp('Email','f-e',f.email,'text','email@contoh.com')}<div class="border-t border-gray-100 pt-4 mt-4"><p class="text-sm font-medium text-gray-700 mb-3">Media Sosial</p><div class="space-y-3">${inp('Instagram','f-ig',f.ig,'text','https://instagram.com/...')}${inp('Facebook','f-fb',f.fb,'text','https://facebook.com/...')}${inp('TikTok','f-tt',f.tt,'text','https://tiktok.com/@...')}</div></div></div>${btns("svFooter()")}`)}
function svFooter(){D.footer.desc=document.getElementById('f-d').value.trim();D.footer.address=document.getElementById('f-a').value.trim();D.footer.phone=document.getElementById('f-p').value.trim();D.footer.email=document.getElementById('f-e').value.trim();D.footer.ig=document.getElementById('f-ig').value.trim();D.footer.fb=document.getElementById('f-fb').value.trim();D.footer.tt=document.getElementById('f-tt').value.trim();save();render()}

function aSettings(){
    const url=getScriptUrl(),cu=!!url,sz=(new Blob([JSON.stringify(D)]).size/1024).toFixed(1);
    return`<div class="space-y-6">
        ${cd(`
            <div class="flex items-center gap-3 mb-6"><div class="w-10 h-10 bg-purple-500 rounded-xl flex items-center justify-center"><span class="iconify text-white" data-icon="lucide:cloud" data-width="20"></span></div><h3 class="text-base font-semibold text-gray-800">Penyimpanan Cloud (Google Spreadsheet)</h3></div>
            <div class="flex items-center gap-3 p-4 rounded-xl mb-5 ${cu?'bg-green-50':'bg-gray-50'}"><span class="w-3 h-3 rounded-full flex-shrink-0 ${cu?'bg-green-500 animate-pulse':'bg-gray-400'}"></span><div><p class="text-sm font-medium ${cu?'text-green-700':'text-gray-600'}">${cu?'Terhubung ke Google Spreadsheet':'Tidak terhubung — menggunakan penyimpanan lokal'}</p>${cu?'<p class="text-xs text-green-600 mt-0.5">Setiap penyimpanan otomatis disinkronkan</p>':'<p class="text-xs text-gray-400 mt-0.5">Atur URL di bawah untuk mengaktifkan sinkronisasi</p>'}</div></div>
            ${inp('Google Script URL','s-url',url,'url','https://script.google.com/macros/s/.../exec')}
            <div class="flex flex-wrap gap-3 mt-4 mb-4">
                <button onclick="testConn()" class="px-4 py-2.5 bg-blue-50 hover:bg-blue-100 text-blue-600 text-sm font-medium rounded-xl transition-colors flex items-center gap-2"><span class="iconify" data-icon="lucide:wifi" data-width="15"></span>Test Koneksi</button>
                <button onclick="saveUrl()" class="px-4 py-2.5 bg-purple-500 hover:bg-purple-600 text-white text-sm font-medium rounded-xl transition-colors flex items-center gap-2"><span class="iconify" data-icon="lucide:save" data-width="15"></span>Simpan URL</button>
            </div>
            <div class="grid sm:grid-cols-2 gap-3 mb-4">
                <button onclick="syncFromCloud()" class="px-4 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-medium rounded-xl transition-colors flex items-center justify-center gap-2"><span class="iconify" data-icon="lucide:download-cloud" data-width="15"></span>Sinkron dari Cloud</button>
                <button onclick="pushCloud()" class="px-4 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-medium rounded-xl transition-colors flex items-center justify-center gap-2"><span class="iconify" data-icon="lucide:upload-cloud" data-width="15"></span>Kirim ke Cloud</button>
            </div>
            <div class="border-t border-gray-100 pt-4 mt-4"><p class="text-xs font-medium text-gray-500 uppercase tracking-wider mb-2">Cara Setup Google Spreadsheet</p><ol class="text-xs text-gray-500 space-y-1.5 list-decimal list-inside"><li>Buka Google Sheets baru di browser</li><li>Klik menu <strong>Extensions → Apps Script</strong></li><li>Hapus kode default, lalu paste script yang tersedia</li><li>Klik <strong>Deploy → New Deployment</strong></li><li>Pilih type <strong>Web app</strong>, access <strong>Anyone</strong></li><li>Copy URL deployment, paste di kolom URL di atas</li></ol></div>
            <div class="flex items-start gap-2 p-3 bg-green-50 rounded-xl mt-4"><span class="iconify text-green-500 mt-0.5 flex-shrink-0" data-icon="lucide:check-circle" data-width="16"></span><p class="text-xs text-green-700">Gambar berupa <strong>Link URL</strong> akan otomatis ikut tersimpan ke spreadsheet. Hanya gambar <strong>Upload</strong> yang tersimpan lokal di browser.</p></div>
        `)}
        ${cd(`<h3 class="text-base font-semibold text-gray-800 mb-4">Informasi Sistem</h3><div class="grid grid-cols-2 sm:grid-cols-3 gap-4"><div><p class="text-xs text-gray-500">Data Lokal</p><p class="text-sm font-semibold text-gray-800">${sz} KB</p></div><div><p class="text-xs text-gray-500">Menu</p><p class="text-sm font-semibold text-gray-800">${D.menus.length}</p></div><div><p class="text-xs text-gray-500">Layanan</p><p class="text-sm font-semibold text-gray-800">${D.services.length}</p></div><div><p class="text-xs text-gray-500">Paket</p><p class="text-sm font-semibold text-gray-800">${D.packages.length}</p></div><div><p class="text-xs text-gray-500">Halaman</p><p class="text-sm font-semibold text-gray-800">${D.pages.length}</p></div><div><p class="text-xs text-gray-500">Versi</p><p class="text-sm font-semibold text-gray-800">2.1.0</p></div></div>`)}
        ${cd(`<h3 class="text-base font-semibold text-gray-800 mb-4">Ekspor / Impor Data</h3><p class="text-sm text-gray-500 mb-4">Backup data sebagai JSON atau pulihkan dari file backup.</p><div class="flex gap-3"><button onclick="exportData()" class="px-5 py-2.5 bg-blue-500 hover:bg-blue-600 text-white text-sm font-medium rounded-xl transition-colors flex items-center gap-2"><span class="iconify" data-icon="lucide:download" data-width="16"></span>Ekspor JSON</button><input type="file" id="imp-f" accept=".json" class="hidden" onchange="importData(this)"><button onclick="document.getElementById('imp-f').click()" class="px-5 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-medium rounded-xl transition-colors flex items-center gap-2"><span class="iconify" data-icon="lucide:upload" data-width="16"></span>Impor JSON</button></div>`)}
        ${cd(`<h3 class="text-base font-semibold text-red-600 mb-4">Zona Berbahaya</h3><p class="text-sm text-gray-500 mb-4">Reset semua data ke pengaturan awal. Tindakan ini tidak dapat dibatalkan.</p><button onclick="resetAll()" class="px-5 py-2.5 bg-red-500 hover:bg-red-600 text-white text-sm font-medium rounded-xl transition-colors flex items-center gap-2"><span class="iconify" data-icon="lucide:alert-triangle" data-width="16"></span>Reset Semua Data</button>`)}
    </div>`;
}

// ===================== ROUTING & INIT =====================
window.addEventListener('hashchange',()=>{if(window.location.hash==='#admin'&&sessionStorage.getItem('jpc_auth')!=='1'){window.location.hash='';showPwd();return}editMode=false;editIdx=-1;section='dashboard';imgTabLogo='upload';imgTabBg='upload';imgTabPage='upload';render()});
D=load();
if(window.location.hash==='#admin'&&sessionStorage.getItem('jpc_auth')!=='1'){window.location.hash='';render();showPwd()}else{render()}
</script>
</body>
