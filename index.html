        .pane-in{animation:tabSlide .2s ease-out}

/* ========== STATE ========== */
var D,section='dashboard',editMode=false,editIdx=-1,sbOpen=false;

/* ========== STORAGE ========== */
function getSU(){try{return localStorage.getItem('jpc_url')||''}catch(e){return ''}}
function setSU(u){try{localStorage.setItem('jpc_url',u)}catch(e){}}
function load(){try{var s=localStorage.getItem('jpc_data');if(s)return JSON.parse(s)}catch(e){}return JSON.parse(JSON.stringify(DEFAULTS))}
function saveLocal(){try{localStorage.setItem('jpc_data',JSON.stringify(D));return true}catch(e){return false}}
function isB64(s){return s&&s.indexOf('data:')===0}
function stripCloud(d){var c=JSON.parse(JSON.stringify(d));(c.pages||[]).forEach(function(p){if(isB64(p.image))p.image='[LOCAL]'});return c}
function mergeLocal(c,l){if(!l)return c;(c.pages||[]).forEach(function(cp,i){if(cp.image==='[LOCAL]'&&l.pages&&l.pages[i]&&l.pages[i].image)cp.image=l.pages[i].image});return c}

/* CORE: Simpan ke lokal + kirim ke cloud */
function save(){
    if(!saveLocal()){toast('Gagal menyimpan. Storage penuh.','error');return}
    toast('Data tersimpan!','success');
    var url=getSU();
    if(!url)return;
    /* Kirim ke spreadsheet tanpa menunggu, fire & forget */
    var x=new XMLHttpRequest();
    x.open('POST',url,true);
    x.setRequestHeader('Content-Type','application/json');
    x.onreadystatechange=function(){};
    x.send(JSON.stringify(stripCloud(D)));
}

/* Ambil data dari cloud, override lokal */
function syncFromCloud(){
    var url=getSU();
    if(!url){toast('URL Google Script belum diatur. Klik "Atur URL" dulu.','error');return}
    toast('Mengunduh dari cloud...','info');
    var x=new XMLHttpRequest();
    x.open('GET',url,true);
    x.timeout=15000;
    x.ontimeout=function(){toast('Timeout. Periksa koneksi.','error')};
    x.onerror=function(){toast('Gagal. Periksa URL & koneksi.','error')};
    x.onload=function(){
        try{
            var cloud=JSON.parse(x.responseText);
            if(cloud&&cloud.hero){
                var local=JSON.parse(localStorage.getItem('jpc_data')||'{}');
                D=mergeLocal(cloud,local);
                saveLocal();
                render();
                toast('Sinkronisasi berhasil!','success');
            }else{toast('Data cloud kosong.','error')}
        }catch(e){toast('Format data cloud tidak valid.','error')}
    };
    x.send();
}

/* Kirim data saat ini ke cloud */
function pushCloud(){
    var url=getSU();
    if(!url){toast('URL belum diatur.','error');return}
    toast('Mengirim ke cloud...','info');
    var x=new XMLHttpRequest();
    x.open('POST',url,true);
    x.setRequestHeader('Content-Type','application/json');
    x.timeout=15000;
    x.ontimeout=function(){toast('Timeout.','error')};
    x.onerror=function(){toast('Gagal mengirim.','error')};
    x.onload=function(){toast('Berhasil dikirim ke cloud!','success')};
    x.send(JSON.stringify(stripCloud(D)));
}

/* Atur URL via prompt (bypass masalah DOM innerHTML) */
function aturURL(){
    var cur=getSU();
    var msg=cur?'URL saat ini:\n'+cur+'\n\nMasukkan URL baru (kosongkan untuk hapus):':'Masukkan Google Script URL:';
    var val=prompt(msg,cur);
    if(val===null)return;
    val=val.trim();
    setSU(val);
    if(val){
        toast('URL disimpan! Mengetes koneksi...','info');
        var x=new XMLHttpRequest();
        x.open('GET',val,true);
        x.timeout=10000;
        x.ontimeout=function(){toast('Timeout. URL mungkin salah.','error')};
        x.onerror=function(){toast('Koneksi gagal. Periksa URL.','error')};
        x.onload=function(){
            try{JSON.parse(x.responseText);toast('URL tersimpan & koneksi berhasil!','success')}
            catch(e){toast('Koneksi berhasil tapi data belum ada. Normal untuk pertama kali.','info')}
        };
        x.send();
    }else{toast('URL dihapus. Kembali ke penyimpanan lokal.','info')}
    render();
}

function testConn(){
    var url=prompt('Masukkan URL untuk ditest:',getSU());
    if(!url||!url.trim()){toast('Dibatalkan.','info');return}

    var x=new XMLHttpRequest();

    x.timeout=10000;
    x.ontimeout=function(){toast('Timeout.','error')};
    x.onerror=function(){toast('Gagal.','error')};
    x.onload=function(){try{JSON.parse(x.responseText);toast('Koneksi berhasil!','success')}catch(e){toast('Gagal parse response.','error')}};
    x.send();
}

function importData(inp){if(!inp.files||!inp.files[0])return;var r=new FileReader();r.onload=function(e){try{var d=JSON.parse(e.target.result);if(d.hero&&d.menus){D=d;save();render();toast('Diimpor!','success')}else toast('Format tidak valid.','error')}catch(err){toast('Gagal baca file.','error')}};r.readAsText(inp.files[0])}

/* ========== TOAST ========== */
function toast(msg,type){
    type=type||'success';var c=document.getElementById('toast-box'),t=document.createElement('div');
    var bg=type==='success'?'bg-green-600':type==='error'?'bg-red-600':'bg-blue-600';
    var ic=type==='success'?'lucide:check-circle':type==='error'?'lucide:x-circle':'lucide:info';
    t.className=bg+' text-white px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3 transform translate-x-[120%] transition-transform duration-300 max-w-sm';
    t.innerHTML='<span class="iconify flex-shrink-0" data-icon="'+ic+'" data-width="20"></span><span class="text-sm font-medium">'+msg+'</span>';
    c.appendChild(t);requestAnimationFrame(function(){t.classList.remove('translate-x-[120%]');t.classList.add('translate-x-0')});
    setTimeout(function(){t.classList.add('translate-x-[120%]');setTimeout(function(){t.remove()},300)},3500);
}

/* ========== IMAGE ========== */
function resizeImg(file,mw,cb){var r=new FileReader();r.onload=function(e){var img=new Image();img.onload=function(){var cv=document.createElement('canvas');var w=img.width,h=img.height;if(w>mw){h=Math.round(h*mw/w);w=mw}cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);cb(cv.toDataURL('image/jpeg',0.8))};img.src=e.target.result};r.readAsDataURL(file)}

function imgGet(pre){var pu=document.getElementById(pre+'-pu');if(!pu)return'';if(pu.classList.contains('hidden')){var el=document.getElementById(pre+'-lk');return el?el.value.trim():''}else{var fi=document.getElementById(pre+'-f');return fi&&fi.files&&fi.files[0]?'__FILE__':''}}
function imgDo(pre,mw,cb){var s=imgGet(pre);if(s==='__FILE__'){var fi=document.getElementById(pre+'-f');if(fi.files[0].size>5*1024*1024){toast('File terlalu besar (maks 5MB)','error');return}resizeImg(fi.files[0],mw,cb)}else{cb(s)}}
