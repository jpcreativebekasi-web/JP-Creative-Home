        .pwd-shake{animation:shake .4s ease-in-out}
        .itab{transition:all .15s}.itab.on{background:#f3e8ff;color:#7c3aed;border-color:#c084fc}
        .pane-in{animation:tabSlide .2s ease-out}
        .spin{animation:spin 1s linear infinite}
        .cloud-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;transition:background .3s}

/* ========== STATE ========== */
var D,section='dashboard',editMode=false,editIdx=-1,sbOpen=false;
var cloudStatus='idle'; /* idle | sending | ok | fail */

/* ========== STORAGE ========== */
function getSU(){try{return localStorage.getItem('jpc_url')||''}catch(e){return ''}}
function setSU(u){try{if(u)localStorage.setItem('jpc_url',u);else localStorage.removeItem('jpc_url')}catch(e){}}
function load(){try{var s=localStorage.getItem('jpc_data');if(s)return JSON.parse(s)}catch(e){}return JSON.parse(JSON.stringify(DEFAULTS))}
function saveLocal(){try{localStorage.setItem('jpc_data',JSON.stringify(D));return true}catch(e){return false}}
function isB64(s){return s&&s.indexOf('data:')===0}
function stripCloud(d){var c=JSON.parse(JSON.stringify(d));(c.pages||[]).forEach(function(p){if(isB64(p.image))p.image='[LOCAL]'});return c}
function mergeLocal(c,l){if(!l)return c;(c.pages||[]).forEach(function(cp,i){if(cp.image==='[LOCAL]'&&l.pages&&l.pages[i]&&l.pages[i].image)cp.image=l.pages[i].image});return c}

/* ========== CORE: SAVE with CLOUD FEEDBACK ========== */
function save(){
    if(!saveLocal()){toast('Gagal simpan lokal. Storage penuh.','error');return}
    var url=getSU();
    if(!url){
        toast('Tersimpan lokal saja (cloud belum diatur)','info');
        cloudStatus='idle';updateDot();return;
    }
    /* Kirim ke cloud dengan feedback jelas */
    cloudStatus='sending';updateDot();
    var x=new XMLHttpRequest();
    x.open('POST',url,true);
    x.setRequestHeader('Content-Type','application/json');
    x.timeout=15000;
    x.ontimeout=function(){
        cloudStatus='fail';updateDot();
        toast('Cloud timeout! Periksa: 1) URL benar 2) Script sudah di-deploy 3) Access=Anyone','error');
    };
    x.onerror=function(){
        cloudStatus='fail';updateDot();
        toast('Cloud gagal! Kemungkinan: URL salah, script belum di-authorize, atau CORS diblokir.','error');
    };
    x.onload=function(){
        if(x.status>=200&&x.status<300){
            cloudStatus='ok';updateDot();
            toast('Tersimpan lokal + cloud berhasil!','success');
        }else{
            cloudStatus='fail';updateDot();
            toast('Cloud error HTTP '+x.status+'. Buka URL di browser dulu untuk authorize.','error');
        }
    };
    x.send(JSON.stringify(stripCloud(D)));
}

function updateDot(){
    var el=document.getElementById('cloud-dot');
    if(!el)return;
    if(cloudStatus==='sending'){el.className='cloud-dot bg-yellow-400 spin';el.title='Mengirim ke cloud...'}
    else if(cloudStatus==='ok'){el.className='cloud-dot bg-green-500';el.title='Cloud: OK'}
    else if(cloudStatus==='fail'){el.className='cloud-dot bg-red-500';el.title='Cloud: GAGAL'}
    else{el.className='cloud-dot bg-gray-400';el.title='Cloud: belum diatur'}
}

/* Sync dari cloud */
function syncFromCloud(){
    var url=getSU();
    if(!url){toast('URL belum diatur. Klik "Atur URL" dulu.','error');return}
    toast('Mengunduh dari cloud...','info');
    cloudStatus='sending';updateDot();
    var x=new XMLHttpRequest();
    x.open('GET',url,true);
    x.timeout=15000;
    x.ontimeout=function(){cloudStatus='fail';updateDot();toast('Timeout.','error')};
    x.onerror=function(){cloudStatus='fail';updateDot();toast('Gagal. Periksa URL & koneksi.','error')};
    x.onload=function(){
        try{
            var cloud=JSON.parse(x.responseText);
            if(cloud&&cloud.hero){
                var local=JSON.parse(localStorage.getItem('jpc_data')||'{}');
                D=mergeLocal(cloud,local);
                saveLocal();
                cloudStatus='ok';updateDot();
                render();
                toast('Sinkronisasi dari cloud berhasil!','success');
            }else{cloudStatus='fail';updateDot();toast('Data cloud kosong. Normal untuk pertama kali.','info')}
        }catch(e){cloudStatus='fail';updateDot();toast('Parse error: '+e.message,'error')}
    };
    x.send();
}

/* Kirim manual ke cloud */
function pushCloud(){
    var url=getSU();
    if(!url){toast('URL belum diatur.','error');return}
    toast('Mengirim ke cloud...','info');
    cloudStatus='sending';updateDot();
    var x=new XMLHttpRequest();
    x.open('POST',url,true);
    x.setRequestHeader('Content-Type','application/json');
    x.timeout=15000;
    x.ontimeout=function(){cloudStatus='fail';updateDot();toast('Timeout.','error')};
    x.onerror=function(){cloudStatus='fail';updateDot();toast('Gagal kirim.','error')};
    x.onload=function(){
        if(x.status>=200&&x.status<300){cloudStatus='ok';updateDot();toast('Berhasil dikirim ke cloud!','success')}
        else{cloudStatus='fail';updateDot();toast('Error HTTP '+x.status+'. Buka URL di browser dulu!','error')}
    };
    x.send(JSON.stringify(stripCloud(D)));
}

/* Atur URL via prompt */
function aturURL(){
    var cur=getSU();
    var val=prompt(cur?'URL saat ini:\n'+cur+'\n\nMasukkan URL baru (kosongkan = hapus):':'Masukkan Google Script URL:\n\nContoh:\nhttps://script.google.com/macros/s/XXXXX/exec',cur);
    if(val===null)return;
    val=val.trim();
    setSU(val);
    if(val){
        toast('URL disimpan. Menguji...','info');
        var x=new XMLHttpRequest();
        x.open('GET',val,true);x.timeout=10000;
        x.ontimeout=function(){cloudStatus='fail';updateDot();toast('Timeout. URL mungkin salah.','error')};
        x.onerror=function(){cloudStatus='fail';updateDot();toast('Koneksi gagal! Pastikan:\n1. URL benar (pakai /exec di akhir)\n2. Script sudah di-deploy\n3. Access = Anyone','error')};
        x.onload=function(){
            try{JSON.parse(x.responseText);cloudStatus='ok';updateDot();toast('URL tersimpan & koneksi OK!','success')}
            catch(e){cloudStatus='fail';updateDot();toast('Koneksi OK tapi data kosong. Normal.','info')}
        };
        x.send();
    }else{cloudStatus='idle';updateDot();toast('URL dihapus. Kembali ke lokal.','info')}
    render();
}

function resetAll(){if(confirm('Reset semua data ke default?')){localStorage.removeItem('jpc_data');D=load();save();render()}}
function exportData(){var b=new Blob([JSON.stringify(D,null,2)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='jpcreative-'+new Date().toISOString().slice(0,10)+'.json';a.click();toast('Diekspor!','success')}
function importData(inp){if(!inp.files||!inp.files[0])return;var r=new FileReader();r.onload=function(e){try{var d=JSON.parse(e.target.result);if(d.hero&&d.menus){D=d;save();render();toast('Diimpor!','success')}else toast('Format tidak valid.','error')}catch(err){toast('Gagal.','error')}};r.readAsText(inp.files[0])}

/* ========== TOAST ========== */
function toast(msg,type){
    type=type||'success';var c=document.getElementById('toast-box'),t=document.createElement('div');
    var bg=type==='success'?'bg-green-600':type==='error'?'bg-red-600':'bg-blue-600';
    var ic=type==='success'?'lucide:check-circle':type==='error'?'lucide:x-circle':'lucide:info';
    t.className=bg+' text-white px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3 transform translate-x-[120%] transition-transform duration-300 max-w-sm';
    t.innerHTML='<span class="iconify flex-shrink-0" data-icon="'+ic+'" data-width="20"></span><span class="text-sm font-medium">'+msg+'</span>';
    c.appendChild(t);requestAnimationFrame(function(){t.classList.remove('translate-x-[120%]');t.classList.add('translate-x-0')});
    setTimeout(function(){t.classList.add('translate-x-[120%]');setTimeout(function(){t.remove()},300)},5000);
}

/* ========== IMAGE ========== */
function resizeImg(file,mw,cb){var r=new FileReader();r.onload=function(e){var img=new Image();img.onload=function(){var cv=document.createElement('canvas');var w=img.width,h=img.height;if(w>mw){h=Math.round(h*mw/w);w=mw}cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);cb(cv.toDataURL('image/jpeg',0.8))};img.src=e.target.result};r.readAsText(file)}
function resizeImg(file,mw,cb){var r=new FileReader();r.onload=function(e){var img=new Image();img.onload=function(){var cv=document.createElement('canvas');var w=img.width,h=img.height;if(w>mw){h=Math.round(h*mw/w);w=mw}cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);cb(cv.toDataURL('image/jpeg',0.8))};img.src=e.target.result};r.readAsDataURL(file)}

/* ========== IMAGE DUAL TAB ========== */
function imgComp(pre,cur){
    var il=isB64(cur),esc=il?'':(cur||'');
    return '<div><label class="block text-sm font-medium text-gray-700 mb-1.5">Sumber Gambar</label><div class="flex gap-2 mb-3"><button type="button" onclick="imgTab(\''+pre+'\',\'u\')" id="'+pre+'-tu" class="itab on flex items-center gap-2 px-4 py-2 text-sm font-medium rounded-xl border border-purple-300"><span class="iconify" data-icon="lucide:upload" data-width="15"></span>Upload</button><button type="button" onclick="imgTab(\''+pre+'\',\'l\')" id="'+pre+'-tl" class="itab flex items-center gap-2 px-4 py-2 text-sm font-medium rounded-xl border border-gray-200 text-gray-500 hover:bg-gray-50"><span class="iconify" data-icon="lucide:link" data-width="15"></span>Link URL</button></div><div id="'+pre+'-pu" class="pane-in"><div class="flex items-start gap-4"><div class="w-24 h-24 rounded-xl '+(cur?'border border-gray-200':'bg-gray-100 border-2 border-dashed border-gray-300')+' flex items-center justify-center overflow-hidden flex-shrink-0">'+(cur?'<img src="'+cur+'" class="w-full h-full object-cover">':'<span class="iconify text-gray-400" data-icon="lucide:image-plus" data-width="28"></span>')+'</div><div><input type="file" id="'+pre+'-f" accept="image/*" class="hidden" onchange="document.getElementById(\''+pre+'-fn\').textContent=this.files[0]?this.files[0].name:\'Pilih file...\'"><button type="button" onclick="document.getElementById(\''+pre+'-f\').click()" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-medium rounded-xl">Pilih File</button><p id="'+pre+'-fn" class="text-xs text-gray-400 mt-1.5">Maks 5MB</p></div></div></div><div id="'+pre+'-pl" class="hidden"><div class="flex items-start gap-4"><div id="'+pre+'-pv" class="w-24 h-24 rounded-xl '+(cur&&!il?'border border-gray-200':'bg-gray-100 border-2 border-dashed border-gray-300')+' flex items-center justify-center overflow-hidden flex-shrink-0">'+(cur&&!il?'<img src="'+esc+'" class="w-full h-full object-cover">':'<span class="iconify text-gray-400" data-icon="lucide:image" data-width="28"></span>')+'</div><div class="flex-1"><input type="url" id="'+pre+'-lk" value="'+esc+'" placeholder="https://example.com/gambar.jpg" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm text-gray-800 focus:outline-none focus:ring-2 focus:ring-purple-500/30 focus:border-purple-500" oninput="imgPrv(\''+pre+'\',this.value)"><p class="text-xs text-gray-400 mt-1.5">Paste link gambar</p><div class="p-2.5 bg-blue-50 rounded-xl mt-2"><p class="text-xs text-blue-600">Google Drive: <code class="bg-blue-100 px-1 rounded text-[11px]">https://lh3.googleusercontent.com/d/FILE_ID=s0</code></p></div></div></div></div>'+(cur?'<div class="mt-2 flex items-center gap-2"><span class="w-2 h-2 rounded-full '+(il?'bg-orange-400':'bg-green-400')+'"></span><span class="text-xs '+(il?'text-orange-600':'text-green-600')+'">'+(il?'Lokal (tidak ke cloud)':'URL (ikut ke cloud ✓)')+'</span></div>':'')+'</div>';
}
function imgTab(pre,t){var pu=document.getElementById(pre+'-pu'),pl=document.getElementById(pre+'-pl'),tu=document.getElementById(pre+'-tu'),tl=document.getElementById(pre+'-tl');if(!pu)return;if(t==='u'){pu.classList.remove('hidden');pl.classList.add('hidden');tu.className='itab on flex items-center gap-2 px-4 py-2 text-sm font-medium rounded-xl border border-purple-300';tl.className='itab flex items-center gap-2 px-4 py-2 text-sm font-medium rounded-xl border border-gray-200 text-gray-500 hover:bg-gray-50'}else{pl.classList.remove('hidden');pu.classList.add('hidden');tl.className='itab on flex items-center gap-2 px-4 py-2 text-sm font-medium rounded-xl border border-purple-300';tu.className='itab flex items-center gap-2 px-4 py-2 text-sm font-medium rounded-xl border border-gray-200 text-gray-500 hover:bg-gray-50'}}

function imgGet(pre){var pu=document.getElementById(pre+'-pu');if(!pu)return'';if(pu.classList.contains('hidden')){var el=document.getElementById(pre+'-lk');return el?el.value.trim():''}else{var fi=document.getElementById(pre+'-f');return fi&&fi.files&&fi.files[0]?'__FILE__':''}}
function imgDo(pre,mw,cb){var s=imgGet(pre);if(s==='__FILE__'){var fi=document.getElementById(pre+'-f');if(fi.files[0].size>5*1024*1024){toast('File terlalu besar','error');return}resizeImg(fi.files[0],mw,cb)}else{cb(s)}}
